name: Build Cheat Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile dylib
        run: |
          mkdir -p build
          clang -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -mios-version-min=12.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -framework OpenGLES \
            -framework QuartzCore \
            -framework CoreGraphics \
            -I/usr/include/substrate \
            -lsubstrate \
            -O2 \
            -o build/cheat_standleo.dylib \
            src/cheat.m

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: cheat_standleo
          path: build/cheat_standleo.dylib
